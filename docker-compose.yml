# 🌐 NETWORKS CONFIGURATION
networks:
  vault-spring-shared-net:
    name: vault-spring-shared-net
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: vault-spring-postgres
    env_file: .env
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - vault-spring-postgres_data:/var/lib/postgresql/data
    networks:
      - vault-spring-shared-net

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: vault-spring-pgadmin
    env_file: .env
    restart: always
    ports:
      - '8088:80'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - vault-spring-pgadmin-data:/var/lib/pgadmin
    networks:
      - vault-spring-shared-net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: vault-spring-postgres-exporter
    env_file: .env
    restart: always
    environment:
      DATA_SOURCE_NAME: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault-spring-shared-net

  # Pinned to the version `latest` already resolved to as of 2026-10-11 (confirmed via
  # the Docker Hub registry API — `latest` and `2.1` share the same push timestamp), so
  # this captures current real behavior rather than reintroducing an older major. 2.x is
  # a major bump from the 1.x series Vault docs mostly cover; re-run `vault-init-dev.sh` /
  # `vault-seed-database-dev.sh` end-to-end under `ok infra` before relying on this (VS-006).
  vault:
    image: hashicorp/vault:2.1.2
    container_name: vault-spring-vault
    env_file: .env
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://127.0.0.1:8200}
      VAULT_API_ADDR: ${VAULT_API_ADDR:-http://127.0.0.1:8200}
    volumes:
      - ./vault/config:/vault/config:ro
      - vault-file-data:/vault/data
    command: "vault server -config=/vault/config/vault.hcl"
    restart: always
    networks:
      - vault-spring-shared-net

  # Scopes Portainer's Docker API access instead of mounting /var/run/docker.sock
  # directly into it — a raw socket mount gives root-equivalent host control to
  # anything that reaches the Portainer container (see VS-004 in
  # docs/audit/VAULTSPRING_AUDIT_REPORT.md). Only the resources Portainer's
  # dashboard actually needs are enabled; Swarm/secrets/config/plugin endpoints
  # stay off. See https://github.com/Tecnativa/docker-socket-proxy for variables.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: vault-spring-docker-socket-proxy
    restart: always
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vault-spring-shared-net

  portainer:
    image: portainer/portainer-ce:2.45.2
    container_name: vault-spring-portainer
    env_file: .env
    restart: always
    ports:
      - '9001:9000'
    command: -H tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    volumes:
      - vault-spring-portainer_data:/data
    networks:
      - vault-spring-shared-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: vault-spring-sonarqube
    env_file: .env
    restart: always
    ports:
      - '9000:9000'
    environment:
      SONAR_JDBC_URL: ${SONAR_JDBC_URL}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
      SONARQUBE_JVM_OPTIONS: ${SONARQUBE_JVM_OPTIONS:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: ${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-true}
    volumes:
      - vault-spring-sonarqube_data:/opt/sonarqube/data
      - vault-spring-sonarqube_extensions:/opt/sonarqube/extensions
      - vault-spring-sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault-spring-shared-net

  app:
    build: .
    ports:
      - "8080:8080"
    container_name: vault-spring-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod-vault}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - vault-spring-shared-net

volumes:
  vault-spring-sonarqube_data:
    name: vault-spring-sonarqube_data
  vault-spring-sonarqube_extensions:
    name: vault-spring-sonarqube_extensions
  vault-spring-sonarqube_logs:
    name: vault-spring-sonarqube_logs
  vault-spring-postgres_data:
    name: vault-spring-postgres_data
  vault-spring-pgadmin-data:
    name: vault-spring-pgadmin-data
  vault-spring-portainer_data:
    name: vault-spring-portainer_data
  vault-file-data:
    name: vault-spring-vault-data
