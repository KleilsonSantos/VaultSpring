networks:
  vaultspring-observability:
    name: vaultspring-observability
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: vaultspring-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/vaultspring.token:/etc/prometheus/vaultspring.token:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - vaultspring-observability

  grafana:
    image: grafana/grafana:11.5.2
    container_name: vaultspring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - vaultspring-observability

  loki:
    image: grafana/loki:3.4.2
    container_name: vaultspring-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - vaultspring-loki-data:/loki
    networks:
      - vaultspring-observability

  tempo:
    image: grafana/tempo:2.7.1
    container_name: vaultspring-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yml
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - vaultspring-tempo-data:/var/tempo
    networks:
      - vaultspring-observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: vaultspring-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    depends_on:
      - tempo
    networks:
      - vaultspring-observability

volumes:
  vaultspring-loki-data:
    name: vaultspring-loki-data
  vaultspring-tempo-data:
    name: vaultspring-tempo-data
