server:
  port: 0

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  cloud:
    vault:
      enabled: false

vaultspring:
  jwt:
    secret: it-jwt-secret-at-least-32-characters-long!!
    expiration-seconds: 3600

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
