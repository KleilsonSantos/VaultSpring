spring:
  datasource:
    url: jdbc:h2:mem:vaultspring;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    vault:
      enabled: false

vaultspring:
  jwt:
    secret: test-jwt-secret-at-least-32-characters-long
    expiration-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  tracing:
    enabled: false
  otlp:
    tracing:
      export:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
