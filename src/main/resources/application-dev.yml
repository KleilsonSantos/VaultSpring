server:
  port: 8080

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    vault:
      enabled: false
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:adminpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /tmp/vaultspring-dev.log

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vaultspring:
  jwt:
    secret: ${VAULTSPRING_JWT_SECRET:dev-only-change-me-use-at-least-32-chars}
    expiration-seconds: ${VAULTSPRING_JWT_EXPIRATION_SECONDS:3600}
