server:
  port: 8080

spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Dev/IT seed fixtures (old V2/V3) are intentionally not on this path (see VS-001).
    # Flyway 11 accepts only migration types *, versioned, and repeatable. A version
    # number (2:missing) throws "Invalid migration type" inside migrate and the
    # process never starts. versioned:missing is the narrowest valid pattern that
    # still lets a database which already applied those removed seeds pass validate.
    # Listing patterns replaces Spring Boot's default *:future, so keep that too.
    ignore-migration-patterns:
      - "*:future"
      - "versioned:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /tmp/vaultspring-hom.log

vaultspring:
  jwt:
    secret: ${VAULTSPRING_JWT_SECRET}
    expiration-seconds: ${VAULTSPRING_JWT_EXPIRATION_SECONDS:3600}
  # security.login-rate-limit.trust-forwarded-header intentionally left at its safe
  # default (false) here — this profile's deployment topology (single trusted edge
  # proxy or not) isn't confirmed. Only set it to true once that's verified; see the
  # comment in application-prod.yml for the confirmed-topology case (Render).
