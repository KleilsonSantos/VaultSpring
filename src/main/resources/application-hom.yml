server:
  port: 8080

spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Schema only. Dev seeds live in classpath:db/dev-seed, which is not under this
    # tree. Flyway scans locations recursively, so nesting seeds in db/migration/dev
    # would still apply them here (see VS-001).
    locations: classpath:db/migration
    # If this environment ever applied the old dev seeds, don't fail validate on their
    # absence. Scoped to those two versions only — a genuinely lost future migration
    # (e.g. V5) must still fail validate, so this is not a blanket "*:missing".
    ignore-migration-patterns:
      - "2:missing"
      - "3:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /tmp/vaultspring-hom.log

vaultspring:
  jwt:
    secret: ${VAULTSPRING_JWT_SECRET}
    expiration-seconds: ${VAULTSPRING_JWT_EXPIRATION_SECONDS:3600}
  # security.login-rate-limit.trust-forwarded-header intentionally left at its safe
  # default (false) here — this profile's deployment topology (single trusted edge
  # proxy or not) isn't confirmed. Only set it to true once that's verified; see the
  # comment in application-prod.yml for the confirmed-topology case (Render).
