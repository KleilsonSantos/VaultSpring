server:
  port: 8080

spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Dev/IT seed fixtures (old V2/V3) are intentionally not on this path (see VS-001).
    # If this environment ever had them applied previously, don't fail validate on their
    # absence. Scoped to those two versions only — a genuinely lost future migration
    # (e.g. V5) must still fail validate, so this is not a blanket "*:missing".
    ignore-migration-patterns:
      - "2:missing"
      - "3:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /tmp/vaultspring-hom.log

vaultspring:
  jwt:
    secret: ${VAULTSPRING_JWT_SECRET}
    expiration-seconds: ${VAULTSPRING_JWT_EXPIRATION_SECONDS:3600}
