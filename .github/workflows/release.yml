name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test, and integration tests
        run: |
          ./mvnw -B verify --no-transfer-progress
          ./mvnw -B -DskipTests verify -Pintegration-tests --no-transfer-progress

      - name: Upload release JAR
        uses: actions/upload-artifact@v6
        with:
          name: vaultspring-${{ github.ref_name }}
          path: target/app.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/app.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
