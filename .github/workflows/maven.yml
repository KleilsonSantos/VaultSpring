name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Maven (nektos/act)
        if: env.ACT
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Checkstyle
        run: ./mvnw -B checkstyle:check --no-transfer-progress

      - name: Unit tests and coverage
        run: ./mvnw -B -DskipTests=false verify --no-transfer-progress

      - name: Upload unit test reports
        if: failure() && !env.ACT
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        if: success() && !env.ACT && hashFiles('target/site/jacoco/jacoco.xml') != ''
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload application JAR
        if: success() && !env.ACT && hashFiles('target/app.jar') != ''
        uses: actions/upload-artifact@v6
        with:
          name: app-build
          path: target/app.jar

      - name: Sonar Scanner (act)
        if: success() && env.ACT
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=vaultspring \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Codecov
        if: success() && !env.ACT && hashFiles('target/site/jacoco/jacoco.xml') != ''
        uses: codecov/codecov-action@v6
        with:
          files: target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: SemVer alignment (main)
        if: github.ref == 'refs/heads/main' && !env.ACT
        run: bash scripts/check-semver-alignment.sh

  integration-tests:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pull Testcontainers image
        run: docker pull postgres:15-alpine

      - name: Integration tests (Failsafe + Testcontainers)
        run: ./mvnw -B -DskipTests verify -Pintegration-tests --no-transfer-progress

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failsafe-reports
          path: target/failsafe-reports/

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image (smoke)
        run: docker build -t vaultspring:ci .

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
