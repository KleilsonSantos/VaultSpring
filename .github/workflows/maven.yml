name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Maven (nektos/act)
        if: env.ACT
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Checkstyle
        run: ./mvnw -B checkstyle:check --no-transfer-progress

      - name: Build, test, coverage
        run: ./mvnw -B -DskipTests=false verify --no-transfer-progress

      - name: Upload JaCoCo report
        if: success() && !env.ACT && hashFiles('target/site/jacoco/jacoco.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload application JAR
        if: success() && !env.ACT && hashFiles('target/app.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: target/app.jar

      - name: Sonar Scanner (act)
        if: success() && env.ACT
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=vaultspring \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Codecov
        if: success() && !env.ACT && hashFiles('target/site/jacoco/jacoco.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        run: ./mvnw -B -DskipTests compile --no-transfer-progress

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
